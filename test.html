<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무사랑 사주 계산 테스트</title>
</head>
<body>
<h2>무사랑 사주 계산 엔진 테스트</h2>
<p id="status">계산 엔진을 불러오는 중입니다...</p>
<pre id="result"></pre>

<script type="module">
import { calculateFourPillars } from
  "https://esm.sh/manseryeok@2.0.0";

try {
  const result = calculateFourPillars({
    year: 1990,
    month: 5,
    day: 15,
    hour: 7,
    minute: 30
  });

  document.getElementById("status").textContent =
    "사주 계산 엔진 연결 성공";

  document.getElementById("result").textContent =
    JSON.stringify(result.toObject(), null, 2);
} catch (error) {
  document.getElementById("status").textContent =
    "계산 오류: " + error.message;
}
</script>
</body>
</html>
